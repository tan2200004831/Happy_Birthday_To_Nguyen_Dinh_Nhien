<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Lê Nhật Tân">
    <title>Handwritten letter</title>
    <link rel="stylesheet" href="./Happy_Birthday/css/index3.css">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <!-- font an toàn cho tiếng Việt (Noto Sans / Roboto) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>

<body>

    <div class="card-frame">
        <div class="card" role="img" aria-label="Happy Birthday card">
            <!-- bouquet image: put your flower image in images/flower.png -->

            <div class="card-back">
                <h1 style="font-size: 250%;" class="typewriter" data-text="Chúc mừng sinh nhật em iu nhóe"><span
                        class="tw-text"></span></h1>
                <p style="font-family: Pacifico, cursive; font-size: 190%;" class="typewriter"
                    data-text="Chúc Nhiên luôn vui vẻ hạnh phúc, luôn cười luôn tung tăng, thành công trong học tập, thuận lợi trong công việc mình làm, đạt được nhiều mong muốn mình đề ra. Chúc Nhiên luôn có nhiều sức khỏe và chúc cho mọi điều may mắn sẽ luôn đến với Tô Nguyễn Đình Nhiên nghe. ">
                    <span class="tw-text"></span>
                </p>

                <button class="special-btn">Quà đặc biệt</button>
            </div>
            <div class="card-page">
                <div class="confetti" aria-hidden="true">
                    <!-- simple SVG confetti layer (various shapes placed absolutely inside) -->
                    <svg viewBox="0 0 800 1100" preserveAspectRatio="none">
                        <!-- stars / circles / triangles with different colors and positions -->
                        <g>
                            <circle cx="110" cy="180" r="22" fill="#ffd7ea" />
                            <rect x="60" y="220" width="26" height="14" rx="4" fill="#ffd37f"
                                transform="rotate(18 73 227)" />
                            <polygon points="680,120 700,160 660,160" fill="#7bd6c6" opacity="0.95" />
                            <circle cx="460" cy="320" r="30" fill="#9fe3ff" />
                            <rect x="520" y="80" width="18" height="40" rx="6" fill="#ffbdc6"
                                transform="rotate(20 529 100)" />
                            <polygon points="110,860 150,860 130,820" fill="#ffd6e0" />
                            <circle cx="270" cy="760" r="20" fill="#ffeea3" />
                            <rect x="360" y="880" width="70" height="14" rx="6" fill="#ff9bd1"
                                transform="rotate(-6 395 887)" />
                            <polygon points="520,720 580,700 540,760" fill="#ffd1a6" />
                            <circle cx="640" cy="950" r="28" fill="#b6f2d8" />
                            <!-- add many small dots -->
                            <g fill="#ffb3d1" opacity="0.95">
                                <circle cx="140" cy="420" r="6" />
                                <circle cx="320" cy="120" r="5" />
                                <circle cx="520" cy="200" r="5" />
                                <circle cx="200" cy="920" r="6" />
                                <circle cx="600" cy="500" r="5" />
                                <circle cx="720" cy="300" r="6" />
                                <circle cx="50" cy="700" r="5" />
                            </g>
                        </g>
                    </svg>
                </div>

                <!-- small decorative shapes near corners -->
                <div class="decor-shape s1">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <polygon points="50,2 65,38 98,38 72,58 80,94 50,72 20,94 28,58 2,38 35,38" fill="#ffd3e9" />
                    </svg>
                </div>
                <div class="decor-shape s2">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <circle cx="50" cy="50" r="40" fill="#bfe6ff" />
                    </svg>
                </div>
                <div class="decor-shape s3">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <rect x="10" y="10" width="80" height="20" rx="6" fill="#fff0b8"
                            transform="rotate(-12 50 50)" />
                    </svg>
                </div>
                <div class="decor-shape s4">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <polygon points="10,80 50,10 90,80" fill="#ffd1cc" />
                    </svg>
                </div>
                <div class="decor-shape s5">
                    <img src="./Happy_Birthday/images/Cake1-removebg-preview.png" alt="cake" />
                </div>
                <div class="decor-shape s6">
                    <img src="./Happy_Birthday/images/Mouse_white-removebg-preview.png" alt="Mouse white">
                </div>
                <div class="decor-shape s7">
                    <img src="./Happy_Birthday/images/firework.png" alt="firework">
                </div>
                <div class="decor-shape s71">
                    <img src="./Happy_Birthday/images/firework.png" alt="firework1">
                </div>
                <div class="decor-shape s8">
                    <img src="./Happy_Birthday/images/cute-star-icon-free-png.png" alt="Star">
                </div>
                <div class="decor-shape s9">
                    <img src="./Happy_Birthday/images/Rainboww-removebg-preview.png" alt="Rainbow">
                </div>
                <div class="decor-shape s10">
                    <img src="./Happy_Birthday/images/Bread-removebg-preview.png" alt="Bread">
                </div>
                <div class="decor-shape s11">
                    <img src="./Happy_Birthday/images/Qua_cute.jpg" alt="Quá cuteeeee">
                </div>
                <!-- central cake plate -->
                <div class="cake-plate">
                    <div class="tagline">Hip hip hooray!</div>

                    <div class="headline" id="headline">HAPPY</div>
                    <div class="headline" id="headline">BIRTHDAY</div>
                    <div class="sub" id="subtext">Tô Nguyễn Đình Nhiên</div>

                    <div class="green-small">Wishing you joy & lots of cake</div>

                    <div class="cake-decor" aria-hidden="true" style="margin-top:18px;">
                        <div class="candle" style="height:64px"></div>
                        <div class="candle" style="height:60px"></div>
                        <div class="candle" style="height:70px"></div>
                        <div class="candle" style="height:58px"></div>
                    </div>

                    <div class="bottom-decor" aria-hidden="true">
                        <div class="mini"></div>
                        <div class="mini"
                            style="background:linear-gradient(180deg,#ffd9c7,#ffc0a8); transform: rotate(4deg); width:90px;">
                        </div>
                        <div class="mini"
                            style="background:linear-gradient(180deg,#ffd9ea,#ffc0ef); transform: rotate(-8deg); width:70px;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./Happy_Birthday/js/index3.js"></script>
</body>

</html>
